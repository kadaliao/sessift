id = "sessift"
name = "sessift"
version = "0.1.1"
min_herdr_version = "0.9.0"
description = "Search and resume AI coding sessions (Claude Code, Codex, Pi, OpenCode, Grok) on this machine and others."
platforms = ["macos", "linux"]

# Bind it in ~/.config/herdr/config.toml:
#   [[keys.command]]
#   key = "prefix+m"
#   type = "plugin_action"
#   command = "sessift.open"
[[actions]]
id = "open"
title = "Search sessions"
description = "Open the session picker in a popup. Enter resumes the session, e puts the command on the prompt."
command = ["sh", "open.sh"]

[[panes]]
id = "picker"
title = "sessift"
placement = "popup"
# Full width: the left border then sits next to the sidebar's narrow separator. Narrower, it can
# land on the right half of a wide character in the pane underneath, and herdr (0.9.5) then
# drops that border cell.
width = "100%"
height = "90%"
command = ["sh", "picker.sh"]
