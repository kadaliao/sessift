[package]
name = "sessift"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
jiff = "0.2.38"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "process", "net", "sync", "time", "signal", "io-std"] }
toml = "1.1.8"
unicode-width = "0.2.3"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
